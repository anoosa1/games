<html lang="en">

<style>

  .layer { position: absolute; inset: 2%; display: grid; grid-template: repeat(15, minmax(0, 1fr)) / repeat(15, minmax(0, 1fr)) }
  .tile { display: grid; place-items: center; background: var(--track); border: 1px solid var(--grid); margin: 0 -1px -1px 0; font-size: clamp(9px, 2.2vw, 18px); font-weight: 750; line-height: 1 }

  #game-choice label { display: flex; align-items: center; gap: 7px; margin: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer }
  #game-choice label:has(:checked) { background: #33483a }
  #game-choice input { width: auto; min-height: auto; margin: 0; accent-color: #92ba9c }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

  .icon-button { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; font-size: 18px }
  .link-icon { position: relative; display: block; width: 18px; height: 14px; transform: rotate(-40deg) }
  .link-icon::before, .link-icon::after { content: ""; position: absolute; top: 3px; width: 10px; height: 8px; box-sizing: border-box; border: 1.5px solid currentColor; border-radius: 5px }

  .drop-board { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); aspect-ratio: var(--columns) / var(--rows); gap: 3px; padding: 8px; background: #405546 }
  .drop-column { display: grid; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); gap: 3px; min-width: 0; border: 0; border-radius: 5px; background: transparent; padding: 0 }
  .drop-column:enabled:hover, .drop-column:focus-visible { background: #718478 }

  .drop-match.layout { grid-template-columns: minmax(0, 1fr); max-width: 620px; margin-inline: auto }

  @media (min-width: 900px) {

</style>

<script>
'use strict';

const COLORS = ['red', 'green', 'yellow', 'blue'];
const TITLES = { ludo: 'Ludo', five: 'Sequence', drop: 'Connect 4' };
const RULES = {
  ludo: [
    'Roll a six to bring a piece out of your yard. Otherwise, move a piece already on the board.',
    'Land on an opponent’s piece to send it back to its yard. Marked squares are safe.',
    'Roll again after a six or a capture.',
    'Use an exact roll to bring a piece home. Get all four home to win.',
  ],
  five: [
    'Pick a card in your hand and place a chip on an empty square with the same card.',
    'If none of your cards fit, exchange a card to end your turn.',
    'Get five of your chips in a straight line to win. Rows, columns and diagonals count.',
    'The game is a draw if the board fills up without a winner.',
  ],
  drop: [
    'Choose a column to drop a piece into its lowest open space.',
    'Get four in a row horizontally, vertically or diagonally to win.',
    'If the board fills up without a winner, the game is a draw.',
  ],
};

const HOME = 56;
const LANE_START = 51;
const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]);
const EMPTY_PIECES = [-1, -1, -1, -1];
const CARD_RANKS = ['2', '4', '6', '8', '10', 'Q'];
const SUITS = ['♠', '♥', '♣', '♦'];
const BOARD_SIZE = 7;
const DROP_ROWS = 6;
const DROP_COLUMNS = 7;
const CARD_TYPES = SUITS.flatMap(suit => CARD_RANKS.map(rank => rank + suit)).concat('A♠');

function rotate([row, col], turns) {
  for (let count = 0; count < turns; count++) [row, col] = [col, 14 - row];
  return [row, col];
}

const QUARTER = [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5], [5, 6], [4, 6], [3, 6], [2, 6], [1, 6], [0, 6], [0, 7], [0, 8]];
const TRACK = COLORS.flatMap((_, seat) => QUARTER.map(square => rotate(square, seat)));
const LANES = COLORS.map((_, seat) => Array.from({ length: 6 }, (_, col) => rotate([7, col + 1], seat)));
const YARDS = COLORS.map((_, seat) => [[1, 1], [1, 4], [4, 1], [4, 4]].map(square => rotate(square, seat)));

function shuffled(items) {
  const order = items.slice();
  const random = new Uint32Array(1);
  for (let index = order.length - 1; index > 0; index--) {
    crypto.getRandomValues(random);
    const other = random[0] % (index + 1);
    [order[index], order[other]] = [order[other], order[index]];
  }
  return order;
}

function newPlayer(name, token) {
  return { name, token, pieces: [...EMPTY_PIECES], hand: [] };
}

function createRoom(game, name) {
  return {
    game, version: 0, phase: 'lobby', turn: 0, winner: null,
    players: [newPlayer(name, null), null, null, null],
    message: '', die: 0, rolledBy: null, moves: [],
    cards: [], chips: [], deck: [], discard: [], line: [],
  };
}

function view(room, seat) {
  const { game, version, phase, turn, winner, players, message, die, rolledBy, moves, cards, chips, line } = room;
  return {
    game, version, phase, turn, winner, message, die, rolledBy, cards, chips, line, you: seat,
    players: players.map(player => player && { name: player.name, pieces: player.pieces, cards: player.hand.length }),
    moves: seat === turn ? moves : [],
    hand: seat === null ? [] : players[seat].hand,
  };
}

function nextTurn(room) {
  do room.turn = (room.turn + 1) % 4;
  while (!room.players[room.turn]);
}

function reset(room, phase) {
  Object.assign(room, { phase, turn: 0, winner: null, die: 0, rolledBy: null, moves: [], line: [] });
  room.message = phase === 'playing' ? room.players[0].name + ' goes first.' : '';
  room.players.forEach(player => {
    if (player) {
      player.pieces = [...EMPTY_PIECES];
      player.hand = [];
    }
  });
  if (room.game === 'drop') {
    room.chips = Array(DROP_ROWS * DROP_COLUMNS).fill(null);
  } else if (room.game === 'five') {
    const boardDeck = [...CARD_TYPES, ...CARD_TYPES.slice(0, -1)];
    room.cards = shuffled(boardDeck);
    room.chips = Array(BOARD_SIZE ** 2).fill(null);
    room.deck = shuffled([...boardDeck, ...boardDeck]);
    room.discard = [];
    if (phase === 'playing') {
      room.players.forEach(player => {
        if (player) player.hand = room.deck.splice(-4);
      });
    }
  }
}

function roll(room, player, seat) {
  if (room.moves.length) throw Error('Move a piece before rolling again.');
  const die = (crypto.getRandomValues(new Uint32Array(1))[0] % 6) + 1;
  room.die = die;
  room.rolledBy = seat;
  room.moves = player.pieces.flatMap((step, index) =>
    (step === -1 && die === 6) || (step >= 0 && step + die <= HOME) ? [index] : []);
  room.message = player.name + ' rolled ' + die + '.';
  if (!room.moves.length) {
    room.message += die === 6 ? ' No legal move. Roll again.' : ' No legal move.';
    if (die !== 6) nextTurn(room);
  }
}

function move(room, player, seat, piece) {
  if (!room.moves.includes(piece)) throw Error('Choose a highlighted piece.');
  const previous = player.pieces[piece];
  const step = previous === -1 ? 0 : previous + room.die;
  player.pieces[piece] = step;
  room.moves = [];
  let captured = false;
  const square = (13 * seat + step) % TRACK.length;
  if (step < LANE_START && !SAFE.has(square)) {
    room.players.forEach((opponent, otherSeat) => {
      if (!opponent || otherSeat === seat) return;
      opponent.pieces.forEach((otherStep, index) => {
        if (otherStep >= 0 && otherStep < LANE_START && (13 * otherSeat + otherStep) % TRACK.length === square) {
          opponent.pieces[index] = -1;
          captured = true;
        }
      });
    });
  }
  if (player.pieces.every(position => position === HOME)) {
    room.phase = 'won';
    room.winner = seat;
    room.message = player.name + ' brought all four pieces home.';
    return;
  }
  room.message = player.name + (captured ? ' sent a piece back to its yard.'
    : step === HOME ? ' brought a piece home.' : ' moved piece ' + (piece + 1) + '.');
  if (captured || room.die === 6) room.message += ' Roll again.';
  else nextTurn(room);
}

function matchingCells(cards, chips, card) {
  return cards.flatMap((value, index) => value === card && chips[index] === null ? [index] : []);
}

function winningLine(chips, index, seat, rows = BOARD_SIZE, columns = BOARD_SIZE, target = 5) {
  const row = Math.floor(index / columns);
  const col = index % columns;
  for (const [dy, dx] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [index];
    for (const direction of [-1, 1]) {
      let r = row + direction * dy;
      let c = col + direction * dx;
      while (r >= 0 && r < rows && c >= 0 && c < columns) {
        const cell = r * columns + c;
        if (chips[cell] !== seat) break;
        line.push(cell);
        r += direction * dy;
        c += direction * dx;
      }
    }
    if (line.length >= target) return line;
  }
  return [];
}

function dropPiece(room, seat, column) {
  if (!Number.isInteger(column) || column < 0 || column >= DROP_COLUMNS) throw Error('Choose a column.');
  if (room.chips[column] !== null) throw Error('That column is full.');
  let cell = (DROP_ROWS - 1) * DROP_COLUMNS + column;
  while (room.chips[cell] !== null) cell -= DROP_COLUMNS;
  room.chips[cell] = seat;
  room.line = winningLine(room.chips, cell, seat, DROP_ROWS, DROP_COLUMNS, 4);
  if (room.line.length || room.chips.every(chip => chip !== null)) {
    room.phase = 'won';
    room.winner = room.line.length ? seat : null;
    room.message = room.line.length ? room.players[seat].name + ' made four in a row.' : 'The board is full.';
    return;
  }
  room.message = '';
  nextTurn(room);
}

function playCard(room, player, seat, action, handIndex, cell) {
  if (!Number.isInteger(handIndex) || handIndex < 0 || handIndex >= player.hand.length) throw Error('Choose a card.');
  const card = player.hand[handIndex];
  if (action === 'play') {
    if (!matchingCells(room.cards, room.chips, card).includes(cell)) throw Error('Choose an empty matching square.');
    room.chips[cell] = seat;
    room.line = winningLine(room.chips, cell, seat);
    if (room.line.length || room.chips.every(chip => chip !== null)) {
      player.hand.splice(handIndex, 1);
      room.phase = 'won';
      room.winner = room.line.length ? seat : null;
      room.message = room.line.length ? player.name + ' made five in a row.' : 'The board is full.';
      return;
    }
    room.message = player.name + ' played ' + card + '.';
  } else {
    if (player.hand.some(value => matchingCells(room.cards, room.chips, value).length)) throw Error('You have a playable card.');
    room.message = player.name + ' exchanged a card.';
  }
  if (!room.deck.length) {
    room.deck = shuffled(room.discard);
    room.discard = [];
  }
  room.discard.push(card);
  player.hand[handIndex] = room.deck.pop();
  nextTurn(room);
}

function joinRoom(room, name, token) {
  const existing = room.players.findIndex(player => player?.token === token);
  if (existing !== -1) return existing;
  if (room.phase !== 'lobby') throw Error('The match has started. Ask the host to reopen the lobby.');
  const guestSeats = room.game === 'drop' ? [2] : [2, 1, 3];
  const seat = guestSeats.find(index => !room.players[index]);
  if (seat === undefined) throw Error('The room is full.');
  room.players[seat] = newPlayer(name, token);
  room.version++;
  return seat;
}

function actionAt(room, seat, input) {
  if (input.version !== room.version) throw Error('The room changed. Try again.');
  if (!room.players[seat]) throw Error('Take a seat first.');
  const { action } = input;
  if (seat === 0 && action === 'lobby') {
    reset(room, 'lobby');
  } else if (seat === 0 && action === 'start' && room.phase !== 'playing') {
    if (room.players.filter(Boolean).length < 2) throw Error('At least two players are needed.');
    reset(room, 'playing');
  } else if (seat === 0 && action === 'remove' && room.phase === 'lobby' && [1, 2, 3].includes(input.seat)) {
    room.players[input.seat] = null;
  } else {
    if (room.phase !== 'playing' || room.turn !== seat) throw Error('Wait for your turn.');
    const player = room.players[seat];
    if (room.game === 'ludo' && action === 'roll') roll(room, player, seat);
    else if (room.game === 'ludo' && action === 'move') move(room, player, seat, input.piece);
    else if (room.game === 'five' && ['play', 'exchange'].includes(action)) playCard(room, player, seat, action, input.card, input.cell);
    else if (room.game === 'drop' && action === 'drop') dropPiece(room, seat, input.column);
    else throw Error('That action is unavailable.');
  }
  room.version++;
}

const byId = id => document.getElementById(id);
byId('drop-board').style.setProperty('--rows', DROP_ROWS);
byId('drop-board').style.setProperty('--columns', DROP_COLUMNS);
const inviteAddress = new URLSearchParams(location.hash.slice(1)).get('join');
const playerToken = inviteAddress
  ? sessionStorage.getItem('tabletop:' + inviteAddress) || crypto.randomUUID()
  : null;
if (playerToken) sessionStorage.setItem('tabletop:' + inviteAddress, playerToken);
const pendingPeers = new Set();
let room = null;
let listener = null;
let guest = null;
let state = null;
let playerName = '';
let connectionReady = false;
let pending = false;
let selected = null;
let runtime = null;

function loadTailcat() {
  runtime ??= (async () => {
    const go = new Go();
    const embedded = '__TAILCAT_WASM__';
    const parts = __TAILCAT_PARTS__;
    const chunks = embedded ? [typeof Uint8Array.fromBase64 === 'function'
      ? Uint8Array.fromBase64(embedded)
      : Uint8Array.from(atob(embedded), char => char.charCodeAt(0))]
      : await Promise.all(Array.from({ length: parts }, async (_, index) => {
        const response = await fetch(`tailcat-${index}.bin`);
        if (!response.ok) throw Error('Could not load Tailcat.');
        return response.arrayBuffer();
      }));
    const decompressed = new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));
    const wasm = await WebAssembly.instantiate(await new Response(decompressed).arrayBuffer(), go.importObject);
    await new Promise((resolve, reject) => {
      window.tabletopReady = resolve;
      go.run(wasm.instance).then(() => reject(Error('Tailcat stopped.')), reject);
    });
  })();
  return runtime;
}

// A single ordered stream carries newline-delimited messages for each player.
function makePeer(connection, receive, onClose) {
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', { fatal: true });
  let closed = false;
  let queue = Promise.resolve();
  let queued = 0;
  const peer = {
    token: null,
    close() {
      if (closed) return;
      closed = true;
      connection.close();
      onClose(peer);
    },
    send(message) {
      if (closed) return;
      if (queued >= 20) {
        peer.close();
        return;
      }
      const bytes = encoder.encode(JSON.stringify(message) + '\n');
      queued++;
      queue = queue.then(() => closed ? undefined : connection.write(bytes))
        .catch(() => peer.close()).finally(() => queued--);
    },
  };
  async function read() {
    let rest = '';
    try {
      while (!closed) {
        const bytes = await connection.read();
        if (!bytes || closed) break;
        rest += decoder.decode(bytes, { stream: true });
        if (rest.length > 16384) throw Error('Message too large');
        let end;
        while ((end = rest.indexOf('\n')) !== -1) {
          const frame = JSON.parse(rest.slice(0, end));
          rest = rest.slice(end + 1);
          if (!frame || typeof frame !== 'object' || Array.isArray(frame)) throw Error('Invalid message');
          receive(peer, frame);
          if (closed) break;
        }
      }
    } catch {
      // Invalid messages and ended sessions both release the peer stream.
    } finally {
      peer.close();
    }
  }
  read();
  return peer;
}

function showStatus(id, text = '') {
  const status = byId(id);
  status.textContent = text;
  status.hidden = !text;
}

function publish() {
  update(view(room, 0));
  for (const peer of pendingPeers) {
    if (!peer.token) continue;
    const seat = room.players.findIndex(player => player?.token === peer.token);
    if (seat === -1) {
      peer.send({ error: 'Your seat was removed. You can reconnect to join again.' });
    } else {
      peer.send({ state: view(room, seat) });
    }
  }
}

function cleanName(value) {
  if (typeof value !== 'string') return '';
  const name = value.trim();
  return name.length <= 20 && !/[\x00-\x1f\x7f]/.test(name) ? name : '';
}

function accept(connection) {
  if (!room || pendingPeers.size >= 8) {
    connection.close();
    return;
  }
  const peer = makePeer(connection, (sender, input) => {
    try {
      if (!sender.token) {
        const name = cleanName(input.name);
        if (input.action !== 'join' || !name || typeof input.token !== 'string' ||
            !/^[a-f0-9-]{36}$/.test(input.token)) throw Error('Enter a name to join.');
        joinRoom(room, name, input.token);
        for (const old of pendingPeers) {
          if (old !== sender && old.token === input.token) old.close();
        }
        sender.token = input.token;
      } else {
        const seat = room.players.findIndex(player => player?.token === sender.token);
        if (seat === -1) throw Error('Your seat was removed. Reconnect to join again.');
        actionAt(room, seat, input);
      }
      publish();
    } catch (err) {
      sender.send({ error: err.message });
    }
  }, sender => {
    clearTimeout(sender.joinTimer);
    pendingPeers.delete(sender);
  });
  pendingPeers.add(peer);
  peer.joinTimer = setTimeout(() => {
    if (!peer.token) peer.close();
  }, 15000);
}

function update(snapshot) {
  if (!state || snapshot.version !== state.version || snapshot.you !== state.you) selected = null;
  state = snapshot;
  render();
}

async function connect() {
  if (byId('enter').disabled) return;
  byId('enter').disabled = true;
  byId('reconnect').disabled = true;
  showStatus('entry-status', 'Joining room…');
  if (state) showStatus('error', 'Reconnecting…');
  let closedMessage = '';
  try {
    await loadTailcat();
    const stream = await window.tabletopDial(inviteAddress);
    const timeout = setTimeout(() => guest?.close(), 12000);
    const current = makePeer(stream, (peer, message) => {
      if (message.error) {
        pending = false;
        if (!connectionReady || message.error.startsWith('Your seat was removed')) {
          closedMessage = message.error;
          peer.close();
        } else {
          showStatus('error', message.error);
          render();
        }
      } else if (message.state) {
        clearTimeout(timeout);
        connectionReady = true;
        pending = false;
        showStatus('error');
        update(message.state);
      }
    }, () => {
      clearTimeout(timeout);
      guest = null;
      connectionReady = false;
      pending = false;
      const note = closedMessage || 'Connection lost. Check that the host still has the room open, then reconnect.';
      showStatus('error', note);
      showStatus('entry-status', note);
      byId('enter').disabled = byId('reconnect').disabled = false;
      if (state) render();
    });
    guest = current;
    guest.send({ action: 'join', name: playerName, token: playerToken });
  } catch {
    const note = 'Could not join the room. Check the invite and ask the host to keep their tab open.';
    showStatus('entry-status', note);
    showStatus('error', note);
    byId('enter').disabled = byId('reconnect').disabled = false;
  }
}

async function host() {
  byId('enter').disabled = true;
  showStatus('entry-status', 'Creating room…');
  try {
    await loadTailcat();
    room = createRoom(document.querySelector('input[name=game]:checked').value, playerName);
    reset(room, 'lobby');
    listener = await window.tabletopListen(accept);
    connectionReady = true;
    publish();
  } catch (error) {
    room = null;
    showStatus('entry-status', 'Could not create the room. Try again. ' + error.message);
    byId('enter').disabled = false;
  }
}

function submit(action, fields = {}) {
  if (!connectionReady || pending) return;
  showStatus('error');
  const input = { action, version: state.version, ...fields };
  if (!room) {
    pending = true;
    guest.send(input);
    render();
    return;
  }
  try {
    actionAt(room, 0, input);
    publish();
  } catch (error) {
    showStatus('error', error.message);
  }
}

function place(element, [row, col], span = 1) {
  element.style.gridArea = `${row + 1} / ${col + 1} / span ${span} / span ${span}`;
}

function tile(css, square, span = 1, label = '') {
  const element = document.createElement('div');
  element.className = css;
  element.textContent = label;
  place(element, square, span);
  byId('tiles').append(element);
  return element;
}

const yards = [[0, 0], [0, 9], [9, 9], [9, 0]].map((square, seat) => {
  const yard = tile('yard ' + COLORS[seat], square, 6);
  const inset = document.createElement('div');
  inset.className = 'yard-inner';
  yard.append(inset);
  return yard;
});
TRACK.forEach((square, index) => {
  const color = index % 13 === 0 ? ' lane ' + COLORS[index / 13] : '';
  tile('tile' + color, square, 1, SAFE.has(index) ? '✦' : '');
});
LANES.forEach((lane, seat) => lane.slice(0, -1).forEach(square => tile('tile lane ' + COLORS[seat], square)));
tile('center', [6, 6], 3);

function button(text, css, click) {
  const el = document.createElement('button');
  el.type = 'button';
  el.textContent = text;
  el.className = css;
  el.addEventListener('click', click);
  return el;
}

function pieceSquare(seat, index, step) {
  if (step === -1) return YARDS[seat][index];
  if (step >= LANE_START) return LANES[seat][step - LANE_START];
  return TRACK[(13 * seat + step) % TRACK.length];
}

function renderLudo(canAct) {
  const cells = new Map();
  state.players.forEach((player, seat) => {
    yards[seat].classList.toggle('inactive', !player);
    if (!player && state.phase !== 'lobby') return;
    (player?.pieces ?? EMPTY_PIECES).forEach((step, index) => {
      const square = pieceSquare(seat, index, step);
      const key = square.join(',');
      if (!cells.has(key)) cells.set(key, { square, buttons: [] });
      const piece = button(index + 1, 'piece ' + COLORS[seat] + (player ? '' : ' empty'), () => submit('move', { piece: index }));
      piece.disabled = !canAct || seat !== state.you || !state.moves.includes(index);
      piece.setAttribute('aria-label', `${player?.name ?? COLORS[seat]}, piece ${index + 1}`);
      cells.get(key).buttons.push(piece);
    });
  });
  const fragment = document.createDocumentFragment();
  for (const { square, buttons } of cells.values()) {
    if (buttons.length === 1) {
      place(buttons[0], square);
      fragment.append(buttons[0]);
    } else {
      const stack = document.createElement('div');
      stack.className = 'stack';
      stack.style.setProperty('--columns', Math.ceil(Math.sqrt(buttons.length)));
      place(stack, square);
      stack.append(...buttons);
      fragment.append(stack);
    }
  }
  byId('pieces').replaceChildren(fragment);
  byId('roll').disabled = !canAct || !!state.moves.length;
  byId('die').textContent = ['–', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][state.die];
  byId('die').setAttribute('aria-label', state.die ? `Die shows ${state.die}` : 'Die has not been rolled');
  const options = byId('move-options');
  options.hidden = !canAct || !state.moves.length;
  options.replaceChildren(...state.moves.map(piece => button('Piece ' + (piece + 1), 'outline', () => submit('move', { piece }))));
}

function renderCards(canAct) {
  const legal = selected === null ? [] : matchingCells(state.cards, state.chips, state.hand[selected]);
  byId('card-board').replaceChildren(...state.cards.map((card, index) => {
    const chip = state.chips[index];
    const cell = button(card, 'card-cell' + (/[♥♦]/.test(card) ? ' suit-red' : ''), () => submit('play', { card: selected, cell: index }));
    cell.disabled = !canAct || !legal.includes(index);
    if (chip !== null) {
      const marker = document.createElement('span');
      marker.className = 'chip ' + COLORS[chip];
      marker.textContent = chip + 1;
      cell.replaceChildren(marker);
    }
    cell.classList.toggle('winning', state.line.includes(index));
    cell.setAttribute('aria-label', `Row ${Math.floor(index / BOARD_SIZE) + 1}, column ${index % BOARD_SIZE + 1}, ${card}` +
      (chip === null ? '' : ', ' + state.players[chip].name + '’s chip'));
    return cell;
  }));
  byId('hand-area').hidden = state.phase === 'lobby';
  byId('hand').replaceChildren(...state.hand.map((card, index) => {
    const option = button(card, 'hand-card' + (/[♥♦]/.test(card) ? ' suit-red' : ''), () => {
      selected = selected === index ? null : index;
      render();
      byId('hand').children[index]?.focus();
    });
    option.disabled = !canAct;
    option.setAttribute('aria-pressed', String(selected === index));
    return option;
  }));
  byId('exchange').hidden = !canAct || selected === null ||
    state.hand.some(card => matchingCells(state.cards, state.chips, card).length);
}

function renderDrop(canAct) {
  const columns = Array.from({ length: DROP_COLUMNS }, (_, column) => {
    const control = button('', 'drop-column', () => submit('drop', { column }));
    const occupants = [];
    for (let row = 0; row < DROP_ROWS; row++) {
      const index = row * DROP_COLUMNS + column;
      const seat = state.chips[index];
      const cell = document.createElement('span');
      cell.className = 'drop-cell';
      if (seat !== null) {
        cell.classList.add('filled', COLORS[seat]);
        cell.classList.toggle('winning', state.line.includes(index));
        cell.textContent = seat === 0 ? '●' : '◆';
        occupants.unshift(state.players[seat].name);
      }
      cell.setAttribute('aria-hidden', 'true');
      control.append(cell);
    }
    const full = state.chips[column] !== null;
    control.disabled = !canAct || full;
    control.setAttribute('aria-label', 'Column ' + (column + 1) + (full ? ', full' : '') +
      (occupants.length ? ', bottom to top: ' + occupants.join(', ') : ', empty'));
    return control;
  });
  byId('drop-board').replaceChildren(...columns);
}

function render() {
  const { game, phase, players, winner, turn, you } = state;
  const lobby = phase === 'lobby';
  const playing = phase === 'playing';
  const myTurn = playing && turn === you;
  const canAct = myTurn && connectionReady && !pending;
  const count = players.filter(Boolean).length;
  const drop = game === 'drop';
  const matchBoardOnly = drop && playing;
  byId('title').textContent = TITLES[game];
  byId('entry').hidden = true;
  byId('table').hidden = false;
  byId('table').classList.toggle('drop-match', matchBoardOnly);
  byId('rules-button').hidden = false;
  byId('invite-button').hidden = !listener;
  byId('ludo-board').hidden = game !== 'ludo';
  byId('card-board').hidden = game !== 'five';
  byId('drop-board').hidden = !drop;
  byId('dice-controls').hidden = game !== 'ludo' || !playing;
  byId('reconnect').hidden = connectionReady || !inviteAddress;
  byId('start').hidden = !room || playing;
  byId('start').disabled = count < 2;
  byId('start').textContent = lobby ? 'Start match' : 'Play again';
  byId('lobby').hidden = !room || lobby || matchBoardOnly;
  byId('turn').setAttribute('aria-live', drop ? 'polite' : 'off');
  byId('turn').textContent = lobby ? 'Lobby'
    : playing ? myTurn ? 'Your turn' : players[turn].name + '’s turn'
    : winner === null ? 'Draw' : winner === you ? 'You win!' : players[winner].name + ' wins!';
  byId('message').textContent = lobby
    ? count + ' of ' + (drop ? 2 : 4) + ' seats filled. ' + (count < 2 ? 'Waiting for another player.' : 'Ready to start.')
    : state.message + (myTurn && state.moves.length ? ' Choose a piece.' : '');
  byId('players').hidden = matchBoardOnly;
  byId('players').replaceChildren(...players.flatMap((player, seat) => {
    if (drop && seat !== 0 && seat !== 2) return [];
    const row = document.createElement('li');
    row.className = 'player ' + COLORS[seat] + (player ? '' : ' empty');
    row.classList.toggle('active', playing && turn === seat);
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.setAttribute('aria-hidden', 'true');
    const name = document.createElement('span');
    name.className = 'player-name';
    name.textContent = player ? player.name + (seat === you ? ' (you)' : seat === 0 ? ' (host)' : '')
      : lobby ? 'Open seat' : 'Unused seat';
    row.append(marker, name);
    if (player && !lobby && !drop) {
      const score = document.createElement('span');
      score.className = 'score';
      score.textContent = game === 'ludo' ? player.pieces.filter(step => step === HOME).length + ' / 4' : player.cards + ' cards';
      row.append(score);
    } else if (player && lobby && room && seat !== 0) {
      const remove = button('Remove', 'quiet remove', () => submit('remove', { seat }));
      remove.setAttribute('aria-label', 'Remove ' + player.name);
      row.append(remove);
    }
    return row;
  }));
  if (game === 'ludo') renderLudo(canAct);
  else if (game === 'five') renderCards(canAct);
  else renderDrop(canAct);
}

if (inviteAddress) {
  byId('entry-title').textContent = 'Join room';
  byId('game-choice').hidden = true;
  byId('enter').textContent = 'Join room';
  byId('name').value = sessionStorage.getItem('tabletop-name') || '';
}
byId('entry-form').addEventListener('submit', event => {
  event.preventDefault();
  playerName = cleanName(byId('name').value);
  if (!playerName) {
    showStatus('entry-status', 'Enter a name between 1 and 20 characters.');
    return;
  }
  sessionStorage.setItem('tabletop-name', playerName);
  if (inviteAddress) connect();
  else host();
});
byId('reconnect').addEventListener('click', connect);
byId('start').addEventListener('click', () => submit('start'));
byId('lobby').addEventListener('click', () => {
  if (state.phase !== 'playing' || confirm('End this match and return to the lobby?')) submit('lobby');
});
byId('roll').addEventListener('click', () => submit('roll'));
byId('exchange').addEventListener('click', () => submit('exchange', { card: selected }));
byId('rules-button').addEventListener('click', () => {
  byId('rule-list').replaceChildren(...RULES[state.game].map(rule => {
    const entry = document.createElement('li');
    entry.textContent = rule;
    return entry;
  }));
  byId('rules').showModal();
});
byId('invite-button').addEventListener('click', async () => {
  const url = new URL(location.href);
  url.hash = new URLSearchParams({ join: listener.address });
  byId('join-code').value = url.href;
  byId('copy').textContent = 'Copy link';
  try {
    await navigator.clipboard.writeText(url.href);
    showStatus('invite-feedback', 'Invite link copied.');
  } catch {
    byId('invite').showModal();
  }
});
byId('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(byId('join-code').value);
    byId('copy').textContent = 'Copied';
  } catch {
    byId('join-code').focus();
    byId('join-code').select();
    byId('copy').textContent = 'Selected for copying';
  }
});
window.addEventListener('pagehide', () => {
  guest?.close();
  for (const peer of pendingPeers) peer.close();
  listener?.close();
});
window.addEventListener('pageshow', event => {
  if (event.persisted && (room || state)) location.reload();
});
byId('enter').disabled = false;
</script>
